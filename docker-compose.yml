# Run everything locally with one command:  docker compose up --build
# Then open http://localhost:4000
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      MONGO_URI: mongodb://mongo:27017/sanjeevani
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-secret-change-me}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
